name: Deploy Slides to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # a11y has playwright-chromium as a dev dependency; the build does not need the browser.
      # Playwright 1.60 does not support ubuntu26.04 yet, and the postinstall fails before the build.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            bc2026/package-lock.json
            a11y/package-lock.json
            app_functions/package-lock.json
            app_functions/ourense26/package-lock.json
            dev_wars/codemotion26/package-lock.json
            a11y_ai/package-lock.json
            a11y_ai/jerez26/package-lock.json
            adaptive_layouts/package-lock.json
            adaptive_layouts/jaen2026/package-lock.json
            programar_tiempos_revueltos/package-lock.json
            programar_tiempos_revueltos/bcn26/package-lock.json

      - name: Install bc2026 dependencies
        run: npm ci
        working-directory: bc2026

      - name: Build bc2026 slides
        run: npm run build -- --base /slideshow/bc2026/
        working-directory: bc2026

      - name: Install a11y dependencies
        run: npm ci
        working-directory: a11y

      - name: Build a11y slides
        run: npm run build -- --base /slideshow/a11y/
        working-directory: a11y

      - name: Install app_functions dependencies
        run: npm ci
        working-directory: app_functions

      - name: Build app_functions slides (EN, base deck)
        run: npm run build -- --base /slideshow/app_functions/
        working-directory: app_functions

      # Spanish copy (app_functions/ourense26): only built once it exists. See app_functions/docs/HANDOFF-ES.md.
      - name: Build app_functions slides (ES, /ourense26/)
        if: ${{ hashFiles('app_functions/ourense26/package.json') != '' }}
        run: |
          npm ci
          npm run build -- --base /slideshow/app_functions/ourense26/
        working-directory: app_functions/ourense26

      # Dev Wars as presented at Codemotion Madrid 2026 (beatdeck).
      - name: Install dev_wars/codemotion26 dependencies
        run: npm ci
        working-directory: dev_wars/codemotion26

      - name: Build dev_wars/codemotion26 slides
        run: npm run build -- --base /slideshow/dev_wars/codemotion26/
        working-directory: dev_wars/codemotion26

      - name: Install a11y_ai dependencies
        run: npm ci
        working-directory: a11y_ai

      - name: Build a11y_ai deck
        run: npm run build -- --base /slideshow/a11y_ai/
        working-directory: a11y_ai

      # Spanish edition (a11y_ai/jerez26): only built once it exists.
      - name: Build a11y_ai deck (ES edition, /jerez26/)
        if: ${{ hashFiles('a11y_ai/jerez26/package.json') != '' }}
        run: |
          npm ci
          npm run build -- --base /slideshow/a11y_ai/jerez26/
        working-directory: a11y_ai/jerez26

      - name: Install adaptive_layouts dependencies
        run: npm ci
        working-directory: adaptive_layouts

      - name: Build adaptive_layouts slides
        run: npm run build -- --base /slideshow/adaptive_layouts/
        working-directory: adaptive_layouts

      # Spanish edition (adaptive_layouts/jaen2026): only built once it exists.
      - name: Build adaptive_layouts slides (ES edition, /jaen2026/)
        if: ${{ hashFiles('adaptive_layouts/jaen2026/package.json') != '' }}
        run: |
          npm ci
          npm run build -- --base /slideshow/adaptive_layouts/jaen2026/
        working-directory: adaptive_layouts/jaen2026

      - name: Install programar_tiempos_revueltos dependencies
        run: npm ci
        working-directory: programar_tiempos_revueltos

      - name: Build programar_tiempos_revueltos slides (EN, base deck)
        run: npm run build -- --base /slideshow/programar_tiempos_revueltos/
        working-directory: programar_tiempos_revueltos

      # Spanish edition (programar_tiempos_revueltos/bcn26): only built once it exists.
      - name: Build programar_tiempos_revueltos slides (ES, /bcn26/)
        if: ${{ hashFiles('programar_tiempos_revueltos/bcn26/package.json') != '' }}
        run: |
          npm ci
          npm run build -- --base /slideshow/programar_tiempos_revueltos/bcn26/
        working-directory: programar_tiempos_revueltos/bcn26

      - name: Assemble dist
        run: |
          mkdir -p dist/bc2026
          mkdir -p dist/a11y
          mkdir -p dist/app_functions
          mkdir -p dist/a11y_ai
          mkdir -p dist/adaptive_layouts
          mkdir -p dist/assets
          cp -r bc2026/dist/. dist/bc2026/
          cp -r a11y/dist/. dist/a11y/
          cp -r app_functions/dist/. dist/app_functions/
          if [ -d app_functions/ourense26/dist ]; then
            mkdir -p dist/app_functions/ourense26
            cp -r app_functions/ourense26/dist/. dist/app_functions/ourense26/
          fi
          mkdir -p dist/dev_wars/codemotion26
          cp -r dev_wars/codemotion26/dist/. dist/dev_wars/codemotion26/
          cp -r a11y_ai/dist/. dist/a11y_ai/
          if [ -d a11y_ai/jerez26/dist ]; then
            mkdir -p dist/a11y_ai/jerez26
            cp -r a11y_ai/jerez26/dist/. dist/a11y_ai/jerez26/
          fi
          cp -r adaptive_layouts/dist/. dist/adaptive_layouts/
          if [ -d adaptive_layouts/jaen2026/dist ]; then
            mkdir -p dist/adaptive_layouts/jaen2026
            cp -r adaptive_layouts/jaen2026/dist/. dist/adaptive_layouts/jaen2026/
          fi
          mkdir -p dist/programar_tiempos_revueltos/bcn26
          cp -r programar_tiempos_revueltos/dist/. dist/programar_tiempos_revueltos/
          if [ -d programar_tiempos_revueltos/bcn26/dist ]; then
            cp -r programar_tiempos_revueltos/bcn26/dist/. dist/programar_tiempos_revueltos/bcn26/
          fi
          cp landing/index.html dist/index.html
          cp -r landing/assets/. dist/assets/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
