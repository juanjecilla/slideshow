<!DOCTYPE html>
<html lang="es" data-theme="light" data-aesthetic="terminal" data-layout="list">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juanje Cilla · Charlas</title>

  <!-- Resolver tema y preferencias de vista antes de pintar para evitar flash -->
  <script>
    (function () {
      try {
        var m = localStorage.getItem("jc-theme") || "system";
        var dark = m === "dark" || (m === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.setAttribute("data-layout", localStorage.getItem("jc-layout") || "list");
        var dens = { compact: ["20px", "14px"], regular: ["30px", "22px"], comfy: ["40px", "30px"] };
        var d = dens[localStorage.getItem("jc-density")] || dens.regular;
        document.documentElement.style.setProperty("--row-pad", d[0]);
        document.documentElement.style.setProperty("--gap", d[1]);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
/* styles.css — Juanje Cilla · Charlas
   Terminal aesthetic, green accent, claro/oscuro/sistema.
*/

/* ---------- Tokens base ---------- */
:root {
  --accent: #00c971;
  --accent-ink: #04140c;

  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Code",
    Menlo, Consolas, monospace;
  --font-sans: "Space Grotesk", ui-sans-serif, system-ui, -apple-system,
    "Segoe UI", sans-serif;

  --row-pad: 30px;
  --gap: 22px;

  --maxw: 1080px;
  --radius: 14px;

  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}

/* ---------- Temas ---------- */
:root,
[data-theme="light"] {
  --bg: #f6f6f4;
  --bg-2: #ffffff;
  --surface: #ffffff;
  --surface-2: #f1f1ee;
  --text: #15171c;
  --text-soft: #3d424d;
  --muted: #767c89;
  --faint: #a2a7b2;
  --border: #e4e4df;
  --border-strong: #d3d3cc;
  --shadow: 0 1px 2px rgba(20, 22, 28, 0.04), 0 8px 26px rgba(20, 22, 28, 0.06);
  --glow: none;
  --grid-line: rgba(20, 23, 28, 0.045);
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #0a0c0f;
  --bg-2: #0e1116;
  --surface: #13161c;
  --surface-2: #1a1e26;
  --text: #e9ecf1;
  --text-soft: #b9c0cc;
  --muted: #828b9a;
  --faint: #565f6e;
  --border: #232832;
  --border-strong: #2e343f;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 40px rgba(0, 0, 0, 0.4);
  --glow: none;
  --grid-line: rgba(255, 255, 255, 0.035);
  color-scheme: dark;
}

[data-aesthetic="terminal"][data-theme="dark"] {
  --glow: 0 0 0 1px color-mix(in oklab, var(--accent) 40%, transparent),
    0 0 24px -6px color-mix(in oklab, var(--accent) 55%, transparent);
}

/* ---------- Reset ---------- */
* {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background 0.4s var(--ease), color 0.4s var(--ease);
  overflow-x: hidden;
}
a {
  color: inherit;
  text-decoration: none;
}
img {
  display: block;
  max-width: 100%;
}
::selection {
  background: color-mix(in oklab, var(--accent) 30%, transparent);
}

/* Rejilla técnica de fondo */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image: linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(120% 80% at 50% 0%, #000 30%, transparent 78%);
  -webkit-mask-image: radial-gradient(120% 80% at 50% 0%, #000 30%, transparent 78%);
}

.wrap {
  position: relative;
  z-index: 1;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 28px;
}

.mono {
  font-family: var(--font-mono);
}

/* =====================================================================
   HEADER
   ===================================================================== */
.site-header {
  position: sticky;
  top: 0;
  z-index: 40;
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  background: color-mix(in oklab, var(--bg) 78%, transparent);
  border-bottom: 1px solid var(--border);
}
.site-header__inner {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 14px 28px;
  display: flex;
  align-items: center;
  gap: 18px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.brand__dot {
  width: 11px;
  height: 11px;
  border-radius: 3px;
  background: var(--accent);
  box-shadow: var(--glow);
  flex: none;
}
.brand__sep {
  color: var(--faint);
}
.brand b {
  color: var(--accent);
  font-weight: 600;
}
.header-spacer {
  flex: 1;
}
.header-nav {
  display: flex;
  gap: 4px;
}
.header-nav a {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
  padding: 7px 12px;
  border-radius: 8px;
  transition: color 0.2s, background 0.2s;
}
.header-nav a:hover {
  color: var(--text);
  background: var(--surface-2);
}
@media (max-width: 720px) {
  .header-nav {
    display: none;
  }
}

/* Segmented controls */
.seg {
  display: inline-flex;
  align-items: center;
  padding: 3px;
  gap: 2px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.seg button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 10px;
  border-radius: 7px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: color 0.18s, background 0.18s;
  line-height: 1;
}
.seg button svg {
  width: 14px;
  height: 14px;
}
.seg button:hover {
  color: var(--text);
}
.seg button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
}
[data-theme="dark"] .seg button[aria-pressed="true"] {
  background: var(--border-strong);
}
.seg--lang button {
  min-width: 30px;
  justify-content: center;
}
.seg--theme .seg-label {
  display: inline;
}
@media (max-width: 560px) {
  .seg--theme .seg-label {
    display: none;
  }
  .seg--theme button {
    padding: 6px 8px;
  }
}

/* =====================================================================
   HERO
   ===================================================================== */
.hero {
  padding: clamp(56px, 11vw, 116px) 0 clamp(40px, 7vw, 72px);
}
.hero__kicker {
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.04em;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 9px;
  margin: 0 0 26px;
}
.hero__kicker .blink {
  color: var(--accent);
}
.prompt {
  color: var(--accent);
  font-weight: 700;
}
.hero h1 {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: clamp(46px, 9vw, 92px);
  line-height: 0.98;
  letter-spacing: -0.035em;
  margin: 0;
  max-width: 14ch;
  text-wrap: balance;
}
.hero h1 .accent {
  color: var(--accent);
}
.hero h1 .cursor {
  display: inline-block;
  width: 0.56ch;
  height: 0.88em;
  margin-left: 0.06em;
  vertical-align: -0.06em;
  background: var(--accent);
  box-shadow: var(--glow);
}
[data-aesthetic="terminal"] .hero h1 .cursor {
  animation: blink 1.05s steps(1) infinite;
}
@keyframes blink {
  50% { opacity: 0; }
}
.hero__sub {
  margin: 28px 0 0;
  font-size: clamp(17px, 2.1vw, 21px);
  line-height: 1.5;
  color: var(--text-soft);
  max-width: 56ch;
  text-wrap: pretty;
}
.hero__meta {
  margin-top: 34px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px 26px;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--muted);
}
.hero__meta > span {
  white-space: nowrap;
}
.hero__meta .dotsep {
  color: var(--faint);
}
.hero__meta b {
  color: var(--text);
  font-weight: 600;
}

/* =====================================================================
   SECTION HEADERS
   ===================================================================== */
.section {
  padding: clamp(34px, 6vw, 60px) 0;
}
.section__head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 30px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 18px;
}
.section__title {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.02em;
  margin: 0;
  display: flex;
  align-items: baseline;
  gap: 10px;
  white-space: nowrap;
  color: var(--text);
}
.section__title .hash {
  color: var(--accent);
}
.section__count {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
  font-weight: 400;
}

/* Filtros */
.filter {
  position: relative;
}
.filter-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 7px 13px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.18s var(--ease);
}
.filter-btn svg {
  width: 15px;
  height: 15px;
}
.filter-btn:hover {
  color: var(--text);
  border-color: var(--border-strong);
}
.filter-btn[data-active="true"] {
  color: var(--accent);
  border-color: color-mix(in oklab, var(--accent) 55%, var(--border));
}
.filter-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: var(--glow);
}
.filter-pop {
  position: absolute;
  right: 0;
  top: calc(100% + 8px);
  z-index: 50;
  min-width: 184px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 6px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
@media (prefers-reduced-motion: no-preference) {
  .filter-pop {
    animation: pop 0.16s var(--ease);
  }
  @keyframes pop {
    from { transform: translateY(-6px); }
  }
}

/* Cabecera de charlas */
.section__head--talks {
  flex-wrap: wrap;
}
.talks-controls {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 12px 16px;
}
.viewbar {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.seg--view button,
.seg--density button {
  padding: 6px;
  min-width: 30px;
  justify-content: center;
}
.seg--view button svg,
.seg--density button svg {
  width: 16px;
  height: 16px;
}
@media (max-width: 720px) {
  .talks-controls {
    width: 100%;
    justify-content: space-between;
  }
}
.filter-opt {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-soft);
  background: transparent;
  border: 0;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.16s, color 0.16s;
}
.filter-opt:hover {
  background: var(--surface-2);
  color: var(--text);
}
.filter-opt[aria-checked="true"] {
  color: var(--accent);
}
.filter-opt__check {
  width: 16px;
  height: 16px;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
}
.filter-opt__check svg {
  width: 16px;
  height: 16px;
}

/* =====================================================================
   TALKS
   ===================================================================== */
.talks {
  display: grid;
  gap: var(--gap);
}
[data-layout="list"] .talks {
  grid-template-columns: 1fr;
}
[data-layout="grid"] .talks {
  grid-template-columns: repeat(2, 1fr);
}
@media (max-width: 760px) {
  [data-layout="grid"] .talks {
    grid-template-columns: 1fr;
  }
}

/* Tarjeta de charla */
.talk {
  position: relative;
  display: grid;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.25s var(--ease), transform 0.25s var(--ease),
    box-shadow 0.25s var(--ease);
}
.talk:hover {
  border-color: color-mix(in oklab, var(--accent) 55%, var(--border));
  box-shadow: var(--shadow);
  transform: translateY(-2px);
}

[data-layout="list"] .talk {
  grid-template-columns: 300px 1fr;
}
@media (max-width: 680px) {
  [data-layout="list"] .talk {
    grid-template-columns: 1fr;
  }
}

[data-layout="grid"] .talk {
  grid-template-columns: 1fr;
}

.talk__media {
  position: relative;
  background: var(--surface-2);
  border-right: 1px solid var(--border);
  overflow: hidden;
}
[data-layout="grid"] .talk__media {
  border-right: 0;
  border-bottom: 1px solid var(--border);
}
@media (max-width: 680px) {
  [data-layout="list"] .talk__media {
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }
}
.talk__media image-slot {
  width: 100%;
  height: 100%;
  min-height: 188px;
  display: block;
}
image-slot::part(empty) {
  color: var(--faint);
  background: transparent;
}
[data-layout="grid"] .talk__media image-slot {
  aspect-ratio: 16 / 9;
  min-height: 0;
  height: auto;
}
.talk__index {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 2;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--accent-ink);
  background: var(--accent);
  padding: 3px 9px;
  border-radius: 7px;
  box-shadow: var(--glow);
  letter-spacing: 0.02em;
}

.talk__body {
  padding: var(--row-pad);
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}
.talk__tags {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.tag {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  background: var(--surface-2);
  border: 1px solid var(--border);
  padding: 3px 9px;
  border-radius: 6px;
}
.tag::before {
  content: "#";
  color: var(--faint);
}
.talk__title {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: clamp(23px, 3vw, 30px);
  line-height: 1.08;
  letter-spacing: -0.025em;
  margin: 0;
  text-wrap: balance;
}
.talk__title em {
  font-style: normal;
  color: var(--accent);
}
.talk__desc {
  margin: 0;
  color: var(--text-soft);
  font-size: 15.5px;
  line-height: 1.55;
  text-wrap: pretty;
}
.talk__foot {
  margin-top: auto;
  padding-top: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}
.talk__conf {
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--muted);
}
.talk__cta {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
}
.talk__cta svg {
  width: 15px;
  height: 15px;
  transition: transform 0.22s var(--ease);
}
.talk:hover .talk__cta svg {
  transform: translate(3px, -3px);
}

.empty {
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--muted);
  padding: 44px 0;
  text-align: center;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
}

/* =====================================================================
   ABOUT
   ===================================================================== */
.about__grid {
  display: grid;
  grid-template-columns: 132px 1fr;
  gap: 38px;
  align-items: start;
}
@media (max-width: 600px) {
  .about__grid {
    grid-template-columns: 1fr;
    gap: 22px;
  }
}
.about__avatar image-slot {
  width: 132px;
  height: 132px;
  display: block;
}
.about__body p {
  margin: 0;
  font-size: clamp(18px, 2.4vw, 23px);
  line-height: 1.5;
  color: var(--text-soft);
  max-width: 56ch;
  text-wrap: pretty;
}
.about__body p .accent {
  color: var(--text);
  font-weight: 500;
}
.about__links {
  margin-top: 26px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  padding: 11px 17px;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s var(--ease);
}
.btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
}
.btn--accent {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
  box-shadow: var(--glow);
}
.btn--accent:hover {
  color: var(--accent-ink);
  filter: brightness(1.06);
}
.btn svg {
  width: 15px;
  height: 15px;
}

/* =====================================================================
   FOOTER
   ===================================================================== */
.site-footer {
  border-top: 1px solid var(--border);
  margin-top: 40px;
  padding: 40px 0 64px;
}
.site-footer__inner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px 28px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--muted);
}
.site-footer__inner > * {
  white-space: nowrap;
}
.site-footer a {
  color: var(--text-soft);
  border-bottom: 1px solid var(--border-strong);
  padding-bottom: 1px;
  transition: color 0.2s, border-color 0.2s;
}
.site-footer a:hover {
  color: var(--accent);
  border-color: var(--accent);
}
.site-footer__brand {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--text-soft);
}

/* =====================================================================
   Terminal adornos
   ===================================================================== */
.term-only {
  display: none;
}
[data-aesthetic="terminal"] .term-only {
  display: inline-flex;
}
[data-aesthetic="terminal"] .hero__kicker::before {
  content: "$";
  color: var(--accent);
  font-weight: 700;
}

/* Entrada suave — opacity siempre 1, solo se anima transform */
@media (prefers-reduced-motion: no-preference) {
  .anim-ready .reveal {
    animation: reveal 0.6s var(--ease) both;
  }
  @keyframes reveal {
    from { transform: translateY(14px); }
    to { transform: none; }
  }
}

  <!-- image-slot web component -->
  <script>
(() => {
  const MAX_DIM = 1200;
  const ACCEPT = ['image/png', 'image/jpeg', 'image/webp', 'image/avif'];

  const subs = new Set();
  let slots = {};
  const tombstones = new Set();
  let loaded = false;
  let loadP = null;
  const STATE_FILE = '.image-slots.state.json';

  function load() {
    if (loadP) return loadP;
    loadP = fetch(STATE_FILE)
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => {
        if (j && typeof j === 'object') {
          const merged = Object.assign({}, j, slots);
          for (const k in slots) {
            if (merged[k] && !merged[k].u && j[k]) {
              merged[k].u = typeof j[k] === 'string' ? j[k] : j[k].u;
            }
          }

    _reframes() {
      return this.hasAttribute('data-filled') &&

    _geom() {

    _clampView() {
      const g = this._geom();
      if (!g) return;
      const mx = Math.max(0, (g.iw * g.base * this._view.s / g.fw - 1) * 50);
      const my = Math.max(0, (g.ih * g.base * this._view.s / g.fh - 1) * 50);
      this._view.x = Math.max(-mx, Math.min(mx, this._view.x));
      this._view.y = Math.max(-my, Math.min(my, this._view.y));
    }

      const g = this._geom();
      const fit = this.getAttribute('fit') || 'cover';
      if (fit !== 'cover' || !g) {
        this._img.style.width = '100%';
        this._img.style.height = '100%';

        this._img.style.top = '50%';

      const h = (g.ih * k / g.fh * 100) + '%';
      const l = (50 + this._view.x) + '%';
      const t = (50 + this._view.y) + '%';

      this._img.style.left = l; this._img.style.top = t;

      else { this._local = v; }

      const shape = (this.getAttribute('shape') || 'rounded').toLowerCase();

      if (shape === 'circle') radius = '50%';
      else if (shape === 'pill') radius = '9999px';

  filter: (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
      <path d="M4 6h16M7 12h10M10 18h4" />
    </svg>
  ),
  check: (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
      <path d="M5 12.5 10 17l9-10" />
    </svg>
  ),
};

function useTheme() {
  const [mode, setMode] = useState(() => localStorage.getItem("jc-theme") || "system");
  useEffect(() => {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const apply = () => {
      const resolved = mode === "system" ? (mq.matches ? "dark" : "light") : mode;
      document.documentElement.setAttribute("data-theme", resolved);
    };
    apply();
    localStorage.setItem("jc-theme", mode);
    mq.addEventListener("change", apply);
    return () => mq.removeEventListener("change", apply);
  }, [mode]);
  return [mode, setMode];
}

function useLang() {
  const [lang, setLang] = useState(() => {
    const saved = localStorage.getItem("jc-lang");
    if (saved) return saved;
    return (navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es";
  });
  useEffect(() => {
    localStorage.setItem("jc-lang", lang);
    document.documentElement.lang = lang;
  }, [lang]);
  return [lang, setLang];
}

function useStored(key, initial) {
  const [v, setV] = useState(() => localStorage.getItem(key) || initial);
  useEffect(() => { localStorage.setItem(key, v); }, [key, v]);
  return [v, setV];
}

function FilterMenu({ filter, setFilter, allTags, lang, t }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("mousedown", onDoc);
      document.removeEventListener("keydown", onKey);
    };
  }, [open]);

  const active = filter !== "all";
  const label = active ? (TAGS[filter] && TAGS[filter][lang]) || filter : t.filter_label;
  const choose = (v) => { setFilter(v); setOpen(false); };

  const opts = [
    { id: "all", label: t.filter_all },
    ...allTags.map((g) => ({ id: g, label: (TAGS[g] && TAGS[g][lang]) || g })),
  ];

  return (
    <div className="filter" ref={ref}>
      <button
        className="filter-btn"
        aria-haspopup="true"
        aria-expanded={open}
        data-active={active}
        onClick={() => setOpen((o) => !o)}
      >
        {Icon.filter}
        <span>{label}</span>
        {active && <span className="filter-dot" aria-hidden="true" />}
      </button>
      {open && (
        <div className="filter-pop" role="menu">
          {opts.map((o) => (
            <button
              key={o.id}
              className="filter-opt"
              role="menuitemradio"
              aria-checked={filter === o.id}
              onClick={() => choose(o.id)}
            >
              <span className="filter-opt__check">{filter === o.id ? Icon.check : null}</span>
              {o.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function ViewControls({ layout, setLayout, density, setDensity, t }) {
  return (
    <div className="viewbar" role="group" aria-label={t.view_label}>
      <div className="seg seg--view" role="group" aria-label={t.layout_label}>
        <button aria-pressed={layout === "list"} onClick={() => setLayout("list")} title={t.layout_list} aria-label={t.layout_list}>
          {Icon.rows}
        </button>
        <button aria-pressed={layout === "grid"} onClick={() => setLayout("grid")} title={t.layout_grid} aria-label={t.layout_grid}>
          {Icon.grid}
        </button>
      </div>
      <div className="seg seg--density" role="group" aria-label={t.density_label}>
        {["compact", "regular", "comfy"].map((d) => (
          <button
            key={d}
            aria-pressed={density === d}
            onClick={() => setDensity(d)}
            title={t["density_" + d]}
            aria-label={t["density_" + d]}

    </div>
  );
}

}

function TalkCard({ talk, lang, t, index }) {

      </div>
      <div className="talk__body">

          {talk.tags.map((tg) => (
            <span className="tag" key={tg}>{(TAGS[tg] && TAGS[tg][lang]) || tg}</span>

          {title[0]}<em>{title[1]}</em>

function Talks({ lang, t, layout, setLayout, density, setDensity }) {
  const [filter, setFilter] = useState("all");

  const allTags = useMemo(() => {
    const set = new Set();
    TALKS.forEach((tk) => tk.tags.forEach((g) => set.add(g)));
    return [...set];
  }, []);

  const filtered = filter === "all" ? TALKS : TALKS.filter((tk) => tk.tags.includes(filter));

  return (
    <section className="section" id="talks">
      <div className="wrap">
        <div className="section__head section__head--talks">
          <h2 className="section__title">
            <span className="hash">#</span>{t.talks_heading}
            <span className="section__count">[{String(filtered.length).padStart(2, "0")}]</span>
          </h2>
          <div className="talks-controls">
            <FilterMenu filter={filter} setFilter={setFilter} allTags={allTags} lang={lang} t={t} />
            <ViewControls layout={layout} setLayout={setLayout} density={density} setDensity={setDensity} t={t} />
          </div>
        </div>
        {filtered.length === 0 ? (
          <div className="empty">{t.empty}</div>
        ) : (
          <div className="talks">
            {filtered.map((tk, i) => (
              <TalkCard key={tk.id} talk={tk} lang={lang} t={t} index={i} />
            ))}
          </div>
        )}
      </div>
    </section>
  );
}

const ACCENT = "#00c971";
const ACCENT_INK = "#04140c";
const DENSITY = {
  compact: { pad: "20px", gap: "14px" },
  regular: { pad: "30px", gap: "22px" },
  comfy: { pad: "40px", gap: "30px" },
};

function App() {
  const [theme, setTheme] = useTheme();
  const [lang, setLang] = useLang();
  const [layout, setLayout] = useStored("jc-layout", "list");
  const [density, setDensity] = useStored("jc-density", "regular");
  const t = I18N[lang];

  useEffect(() => {
    const root = document.documentElement;
    root.setAttribute("data-aesthetic", "terminal");
    root.setAttribute("data-layout", layout);
    root.style.setProperty("--accent", ACCENT);
    root.style.setProperty("--accent-ink", ACCENT_INK);
    const d = DENSITY[density] || DENSITY.regular;
    root.style.setProperty("--row-pad", d.pad);
    root.style.setProperty("--gap", d.gap);
  }, [layout, density]);

  useEffect(() => {
    const id = requestAnimationFrame(() =>
      requestAnimationFrame(() => document.documentElement.classList.add("anim-ready"))
    );
    return () => cancelAnimationFrame(id);
  }, []);

  return (
    <React.Fragment>
      <Header theme={theme} setTheme={setTheme} lang={lang} setLang={setLang} t={t} />
      <main>
        <Hero t={t} count={TALKS.length} />
        <Talks lang={lang} t={t} layout={layout} setLayout={setLayout} density={density} setDensity={setDensity} />
        <About t={t} lang={lang} />
      </main>
      <Footer t={t} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
